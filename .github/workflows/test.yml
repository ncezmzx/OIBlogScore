name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    # The setup-python catalog has Python 3.8 builds for Ubuntu 22.04, not 26.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python tools/check_quality.py
      - run: python -m unittest discover -s tests -v

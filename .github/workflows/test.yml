name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    # The setup-python catalog has Python 3.8 builds for Ubuntu 22.04, not 26.04.
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.8', '3.12']
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip wheel --no-deps --wheel-dir wheelhouse .
      - run: python -m pip install --no-index --find-links wheelhouse oiblogscore
      - run: oiblogscore --help
        working-directory: ${{ runner.temp }}
      - run: python tools/check_quality.py
      - run: python tools/catalog.py stats
      - run: python -m unittest discover -s tests -v

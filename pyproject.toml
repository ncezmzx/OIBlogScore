[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oiblogscore"
version = "0.1.0"
description = "Evidence-driven competitive programming blog review and guarded repair"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
oiblogscore = "oiblogscore.cli:main"

[tool.setuptools.package-data]
oiblogscore = ["rules.json"]
